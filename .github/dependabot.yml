# Updates the GitHub Actions used in the workflows. Pull requests target `staging`.
# The core (.core) is not updated by Dependabot but by core-update.yml,
# because it is pinned to tags rather than the latest commit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
