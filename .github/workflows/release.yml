# On push of a tag `vX.Y.Z` (on `main` only): GitHub release with generated notes and a ZIP of the modules.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main – releases are made from main only."
            exit 1
          fi

      - name: Build module ZIP
        run: |
          zip -r "modules-${GITHUB_REF_NAME}.zip" modules \
            -x 'modules/node_modules/*' 'modules/package.json' 'modules/package-lock.json'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a hyphen (v1.0.0-pre.1) are pre-releases
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" "modules-${GITHUB_REF_NAME}.zip" \
            --generate-notes --verify-tag $prerelease
