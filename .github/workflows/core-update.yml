# Checks weekly whether there is a newer core tag and, if so, opens a pull request against `staging`
# that moves the .core submodule to that tag. CI for the branch is started afterwards.
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Core update

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  core-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
          submodules: true
          fetch-depth: 0

      - name: Find latest core tag
        id: tag
        run: |
          current=$(git -C .core describe --tags --exact-match 2>/dev/null || git -C .core rev-parse --short HEAD)
          # Pre-releases (v2.0.0-pre.2) sort before the final version (v2.0.0)
          latest=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname \
            "$(git config -f .gitmodules submodule..core.url)" 'v*' | head -n1 | sed 's|.*refs/tags/||')
          echo "Core: current $current, latest tag $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.tag.outputs.latest != '' && steps.tag.outputs.latest != steps.tag.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.tag.outputs.current }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          branch="chore/core-${LATEST}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists – nothing to do."
            exit 0
          fi
          git -C .core fetch --tags --quiet
          git -C .core checkout --quiet "$LATEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add .core
          git commit -m "chore(core): update core to ${LATEST}"
          git push origin "$branch"
          gh pr create --base staging --head "$branch" \
            --title "chore(core): update core to ${LATEST}" \
            --body "Created automatically: core \`${CURRENT}\` → \`${LATEST}\`. Check the core release notes, wait for CI, then merge."
          # Pull requests created with GITHUB_TOKEN don't trigger CI – start it explicitly
          gh workflow run ci.yml --ref "$branch"
