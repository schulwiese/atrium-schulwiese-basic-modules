# CI of the module repo: modules against the pinned core (.core = submodule on a fixed tag) – required.
# Additionally against the current core `main` as an early warning (continue-on-error).
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  CI: 'true'
  APP_SECRET: build-time-placeholder-build-time-placeholder

jobs:
  branch-name:
    name: Branch rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and target
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          # Naming scheme: see .claude/rules/conventions.md → Branches; Dependabot branches are allowed
          if [[ ! "$HEAD" =~ ^(feature|fix|hotfix|chore|docs)/[a-z0-9]+(-[a-z0-9.]+)*$ \
                && ! "$HEAD" =~ ^dependabot/ && "$HEAD" != staging && "$HEAD" != main ]]; then
            echo "::error::Branch '$HEAD' does not match <type>/<short-description> (feature|fix|hotfix|chore|docs, kebab-case)."
            exit 1
          fi
          if [[ "$BASE" == main && "$HEAD" != staging && ! "$HEAD" =~ ^hotfix/ ]]; then
            echo "::error::Only staging or hotfix/* may target main – please open the pull request for '$HEAD' against staging."
            exit 1
          fi
          echo "Branch '$HEAD' → '$BASE' is fine."

  modules:
    name: Modules (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        core: [pinned, main]
    continue-on-error: ${{ matrix.core == 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          # The core (KalypzoSolutions/kalypzo-atrium) is public; if it becomes private, add a token as secret CORE_REPO_TOKEN
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}
      - name: Core on main (warning run only)
        if: matrix.core == 'main'
        run: git -C .core fetch origin main && git -C .core checkout origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .core/.nvmrc
      - run: npm run setup
      - run: npm run check:catalog
      - run: npm run check:migrations
      - run: npm run format:check
      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
